# nginx site for the all-in-one container.
#
# A single port (7860, the one Hugging Face Spaces exposes) serves both halves of
# the application: the static web UI and the Rasa REST API. Serving them from the
# same origin means the browser makes same-origin requests, so no CORS handling or
# public tunnel (ngrok) is needed — the frontend simply calls
# `location.origin + "/webhooks/rest/webhook"`.

server {
    listen 7860;
    server_name _;

    # --- Static web UI (frontend/) -----------------------------------------
    root /app/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Rasa REST API, tracker and status -> Rasa server on :5005 ----------
    # All of these live on the Rasa HTTP server running in the same container.
    location ~ ^/(webhooks|conversations|status|version) {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Custom actions call external APIs (Climatiq, etc.), so allow a
        # generous timeout before nginx gives up on the upstream.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
