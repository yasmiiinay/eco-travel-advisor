# NLU training data for the Eco-Travel Advisor.
# Intents and entities match domain.yml exactly. Examples cover button payloads
# (single-entity messages) and free text, plus typos, natural traveller phrases,
# and out-of-scope inputs. The set was expanded (~20-30 examples per intent,
# focusing on the weaker control intents) after cross-validation showed the
# original data was too small to generalise. None of these examples duplicate
# tests/test_nlu_samples.yml, so the held-out evaluation stays honest.

version: "3.1"

nlu:

