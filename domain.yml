# Domain for the Eco-Travel Advisor.
# Aligned with the UX preview (button-driven happy path + free text), and with
# the action names that actions.py will implement (which call repository.py and
# carbon.py). Written for Rasa 3.6.x.

version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - bot_challenge
  - plan_trip                 # user wants to start planning
  - inform                    # carries slot entities (origin, destination, ...)
  - request_recommendations   # "show me the plan / recommendations"
  - request_human             # human-advisor handover
  - go_back                   # step back to the previous question
  - edit_answer               # change a previously given answer
  - reset_trip                # start the whole trip over
  - out_of_scope              # anything unrelated to trip planning

entities:
  - origin
  - destination
  - travel_date
  - num_travellers
  - budget
  - sustainability_pref
  - field_to_edit              # which answer to edit (from edit buttons); never a slot value

# ---------------------------------------------------------------------------
# Slots
# influence_conversation is kept false so the dialogue is driven by intents and
# the form loop rather than by free-text slot values (keeps TEDPolicy stable).
# Data slots below are written only by custom actions (custom mapping).
# ---------------------------------------------------------------------------
slots:
  origin:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: origin
        not_intent: &control_intents
          - go_back
          - edit_answer
          - reset_trip
          - request_human
          - out_of_scope
          - affirm
          - deny
          - greet
          - goodbye
          - bot_challenge
          - plan_trip
          - request_recommendations
      - type: from_text
        not_intent: *control_intents
        conditions:
          - active_loop: trip_planning_form
            requested_slot: origin

  destination:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: destination
        not_intent: *control_intents
      - type: from_text
        not_intent: *control_intents
        conditions:
          - active_loop: trip_planning_form
            requested_slot: destination

  travel_date:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: travel_date
        not_intent: *control_intents
      - type: from_text
        not_intent: *control_intents
        conditions:
          - active_loop: trip_planning_form
            requested_slot: travel_date

  num_travellers:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: num_travellers
        not_intent: *control_intents
      - type: from_text
        not_intent: *control_intents
        conditions:
          - active_loop: trip_planning_form
            requested_slot: num_travellers

  budget:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: budget
        not_intent: *control_intents
      - type: from_text
        not_intent: *control_intents
        conditions:
          - active_loop: trip_planning_form
            requested_slot: budget

  sustainability_pref:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: sustainability_pref
        not_intent: *control_intents
      - type: from_text
        not_intent: *control_intents
        conditions:
          - active_loop: trip_planning_form
            requested_slot: sustainability_pref

  # --- Data slots, written by custom actions only ---
  estimated_co2:
    type: float
    influence_conversation: false
    mappings:
      - type: custom
  carbon_level:               # green / amber / red
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  data_source:                # climatiq / neondb / json_fallback / unavailable
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  destination_guess:          # holds a typo suggestion, e.g. "Paris" for "Pariiis"
    type: text
    influence_conversation: false
    mappings:
      - type: custom

# ---------------------------------------------------------------------------
# Forms
# ---------------------------------------------------------------------------
forms:
  trip_planning_form:
    required_slots:
      - origin
      - destination
      - travel_date
      - num_travellers
      - budget
      - sustainability_pref

# ---------------------------------------------------------------------------
# Custom actions (implemented later in actions.py)
# ---------------------------------------------------------------------------
actions:
  - validate_trip_planning_form   # validates slots, parses traveller phrases, typo clarification
  - action_estimate_carbon        # uses carbon.py -> sets estimated_co2 / carbon_level / data_source
  - action_recommend_plan         # uses repository.py -> hotels, transport comparison, offsets
  - action_high_emission_alert    # warns on red transport and suggests a greener alternative
  - action_clarify_destination    # "Did you mean Paris?" confirmation flow
  - action_go_back                # reopen the previous slot
  - action_edit_answer            # reopen a chosen slot
  - action_reset_trip             # clear all trip slots
  - action_handover               # package full context for a human advisor
  - action_scoped_fallback        # DC-08: place-name aware low-confidence fallback

# ---------------------------------------------------------------------------
# Responses
# Form prompts are named utter_ask_<slot> so the form requests them automatically.
# Buttons make the happy path completable without typing; free text still works.
# ---------------------------------------------------------------------------
responses:

  utter_greet:
    - text: "Hi! I'm your Eco-Travel Advisor. I can help you plan a lower-carbon trip and estimate its footprint. Ready to start?"
      buttons:
        - title: "Plan a trip"
          payload: "/plan_trip"

  utter_ask_origin:
    - text: "Where are you travelling from? Tap a city or type one - I support 12 popular European cities (Paris, Berlin, Amsterdam, Copenhagen, London, Madrid, Rome, Barcelona, Vienna, Munich, Lisbon, Prague)."
      buttons:
        - title: "London"
          payload: '/inform{"origin": "London"}'
        - title: "Paris"
          payload: '/inform{"origin": "Paris"}'
        - title: "Madrid"
          payload: '/inform{"origin": "Madrid"}'
        - title: "Rome"
          payload: '/inform{"origin": "Rome"}'
        - title: "Berlin"
          payload: '/inform{"origin": "Berlin"}'
        - title: "Barcelona"
          payload: '/inform{"origin": "Barcelona"}'

  utter_ask_destination:
    - text: "Which destination would you like to explore? Tap one or type a city (I support Paris, Berlin, Amsterdam, Copenhagen, London, Madrid, Rome, Barcelona, Vienna, Munich, Lisbon and Prague)."
      buttons:
        - title: "Paris"
          payload: '/inform{"destination": "Paris"}'
        - title: "Berlin"
          payload: '/inform{"destination": "Berlin"}'
        - title: "Amsterdam"
          payload: '/inform{"destination": "Amsterdam"}'
        - title: "London"
          payload: '/inform{"destination": "London"}'
        - title: "Rome"
          payload: '/inform{"destination": "Rome"}'
        - title: "Barcelona"
          payload: '/inform{"destination": "Barcelona"}'

  utter_ask_travel_date:
    - text: "When are you planning to travel? You can type the dates, or choose a flexible plan."
      buttons:
        - title: "I'm flexible"
          payload: '/inform{"travel_date": "flexible"}'

  utter_ask_num_travellers:
    - text: "How many people are travelling? Pick a number, or type a phrase like \"me and my wife\"."
      buttons:
        - title: "Just me"
          payload: '/inform{"num_travellers": "1"}'
        - title: "2"
          payload: '/inform{"num_travellers": "2"}'
        - title: "3"
          payload: '/inform{"num_travellers": "3"}'
        - title: "4"
          payload: '/inform{"num_travellers": "4"}'

  utter_ask_budget:
    - text: "What's your rough daily budget per person?"
      buttons:
        - title: "Budget (up to 80 EUR/day)"
          payload: '/inform{"budget": "budget"}'
        - title: "Mid (80-150 EUR/day)"
          payload: '/inform{"budget": "mid"}'
        - title: "Comfort (150+ EUR/day)"
          payload: '/inform{"budget": "comfort"}'

  utter_ask_sustainability_pref:
    - text: "Last question - what matters most for this trip? This shapes how I rank your options."
      buttons:
        - title: "Lowest carbon"
          payload: '/inform{"sustainability_pref": "low_carbon"}'
        - title: "Eco-certified hotels"
          payload: '/inform{"sustainability_pref": "eco_certified"}'
        - title: "Local community support"
          payload: '/inform{"sustainability_pref": "local_culture"}'
        - title: "Balanced"
          payload: '/inform{"sustainability_pref": "balanced"}'

  utter_carbon_disclaimer:
    - text: "Note: carbon values are estimates based on average emission factors and curated prototype data. Verify against an official source (e.g. DEFRA/ICAO) before relying on them."

  utter_out_of_scope:
    - text: "I can only help with planning a sustainable trip - destinations, transport, eco-hotels and your carbon footprint. Shall we carry on with that?"
      buttons:
        - title: "Continue planning"
          payload: "/plan_trip"

  utter_ask_rephrase:
    - text: "Sorry, I didn't quite catch that. I can help you plan a sustainable trip - start below, or talk to a human advisor."
      buttons:
        - title: "Plan a trip"
          payload: "/plan_trip"
        - title: "Talk to a human"
          payload: "/request_human"

  utter_trip_reset:
    - text: "No problem - I've cleared your trip. Let's start fresh."
      buttons:
        - title: "Plan a trip"
          payload: "/plan_trip"

  utter_iamabot:
    - text: "I'm the Eco-Travel Advisor, an automated assistant for sustainable trip planning. I can hand you over to a human advisor at any time."

  utter_goodbye:
    - text: "Safe and sustainable travels! Come back any time to plan your next trip."

  utter_default:
    - text: "I'm not sure I understood. I can help you plan a sustainable trip between 12 popular European cities - choose an option or type a city."
      buttons:
        - title: "Plan a trip"
          payload: "/plan_trip"
        - title: "Talk to a human"
          payload: "/request_human"

# ---------------------------------------------------------------------------
# Session configuration
# ---------------------------------------------------------------------------
session_config:
  session_expiration_time: 60        # minutes of inactivity before a new session
  carry_over_slots_to_new_session: true
