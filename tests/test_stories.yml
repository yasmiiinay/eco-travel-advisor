# Held-out Core (dialogue) test stories for the Eco-Travel Advisor.
# End-to-end format: each turn gives the *user text* so the test exercises the
# full pipeline (NLU + dialogue policies), then asserts the predicted action.
# These are NEW conversations with unseen wording - not copies of data/stories.yml.
# Run with:  rasa test core --stories tests/test_stories.yml
#
# Note: rasa test core checks predicted *action names*; custom action side-effects
# (e.g. slots set inside the form) are validated interactively (rasa shell) or with
# the action server running. These stories therefore focus on policy-predictable
# paths: greet, scope guard, controls, handover and the recommendation chain.

version: "3.1"

stories:

  - story: held-out greet then bot challenge
    steps:
      - user: |
          good evening
        intent: greet
      - action: utter_greet
      - user: |
          wait, is there a human behind this
        intent: bot_challenge
      - action: utter_iamabot

  - story: held-out out-of-scope then start planning
    steps:
      - user: |
          can you tell me tonight's lottery numbers
        intent: out_of_scope
      - action: utter_out_of_scope
      - user: |
          ok let's organise an eco getaway
        intent: plan_trip
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - story: held-out human handover
    steps:
      - user: |
          put me through to a real travel agent please
        intent: request_human
      - action: action_handover

  - story: held-out reset trip
    steps:
      - user: |
          scrap all that and begin from zero
        intent: reset_trip
      - action: action_reset_trip

  - story: held-out go back
    steps:
      - user: |
          actually take me one step back
        intent: go_back
      - action: action_go_back

  - story: held-out edit a previous answer
    steps:
      - user: |
          I'd like to amend my chosen city
        intent: edit_answer
      - action: action_edit_answer

  - story: held-out recommendation request with high-emission chain
    steps:
      - user: |
          could you show me the options once more
        intent: request_recommendations
      - action: action_estimate_carbon
      - action: action_recommend_plan
      - action: action_high_emission_alert

  - story: held-out goodbye
    steps:
      - user: |
          that's everything, cheers
        intent: goodbye
      - action: utter_goodbye

  # --- DC-01: inform with trip details (no active loop) must start the form ---
  - story: DC-01 inform with origin and destination starts the form
    steps:
      - user: |
          I want to plan a trip from London to Paris
        intent: inform
        entities:
          - origin: London
          - destination: Paris
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - story: DC-01 destination only starts the form
    steps:
      - user: |
          Berlin
        intent: inform
        entities:
          - destination: Berlin
      - action: trip_planning_form
      - active_loop: trip_planning_form

  # --- DC-02: affirming the greeting starts the form ---
  - story: DC-02 affirm after greet starts the form
    steps:
      - user: |
          hello there
        intent: greet
      - action: utter_greet
      - user: |
          yes please
        intent: affirm
      - action: trip_planning_form
      - active_loop: trip_planning_form

  # --- DC-05: edit selects a field (no slot pollution) ---
  - story: DC-05 edit a specific field
    steps:
      - user: |
          /edit_answer{"field_to_edit": "travel_date"}
        intent: edit_answer
        entities:
          - field_to_edit: travel_date
      - action: action_edit_answer

  # --- DC-06: go back during the form routes to action_go_back ---
  - story: DC-06 go back during the form
    steps:
      - user: |
          I want to plan a trip
        intent: plan_trip
      - action: trip_planning_form
      - active_loop: trip_planning_form
      - user: |
          can we go back
        intent: go_back
      - action: action_go_back

  # --- DC-07: typo destination outside the form starts planning ---
  - story: DC-07 typo destination outside the form starts planning
    steps:
      - user: |
          berln
        intent: inform
        entities:
          - destination: Berlin
      - action: trip_planning_form
      - active_loop: trip_planning_form

  # --- DC-08: out-of-scope is redirected, not a fallback ---
  - story: DC-08 out of scope is redirected
    steps:
      - user: |
          what's the weather tomorrow
        intent: out_of_scope
      - action: utter_out_of_scope

  # --- DC-08: a low-confidence place-name input routes to the scoped fallback ---
  - story: DC-08 unsupported place name gets the scoped fallback
    steps:
      - user: |
          adana
        intent: nlu_fallback
      - action: action_scoped_fallback

  # --- greet then an explicit start command begins the form ---
  - story: greet then start planning starts the form
    steps:
      - user: |
          hi there
        intent: greet
      - action: utter_greet
      - user: |
          start planning
        intent: plan_trip
      - action: trip_planning_form
      - active_loop: trip_planning_form

  # --- numeric budget keeps the form moving (inform stays in the loop) ---
  - story: numeric budget continues the form
    steps:
      - user: |
          I want to plan a trip
        intent: plan_trip
      - action: trip_planning_form
      - active_loop: trip_planning_form
      - user: |
          around 100 per day
        intent: inform
      - action: trip_planning_form

  # --- BUGFIX HIGH-3: "plan a trip from X to Y" wording still starts the form
  #     (the from-to slots themselves are asserted in tests/test_actions_unit.py,
  #     since slot side-effects are not visible to rasa test core) ---
  - story: plan a trip with from-to wording starts the form
    steps:
      - user: |
          help me plan a trip from Rome to Amsterdam
        intent: plan_trip
        entities:
          - origin: Rome
          - destination: Amsterdam
      - action: trip_planning_form
      - active_loop: trip_planning_form
